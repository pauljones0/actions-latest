name: Monitor catalog freshness
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: action-catalog-health
  cancel-in-progress: false
jobs:
  health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python scripts/install_tooling.py
      - run: uv sync --locked --group dev
      - name: Check freshness and recover stalled updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/check_health.py
