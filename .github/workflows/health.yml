name: Monitor catalog freshness
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: action-catalog-health
  cancel-in-progress: false
jobs:
  health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/install_tooling.py
      - run: uv sync --locked --group dev
      - name: Check freshness and recover stalled updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/check_health.py
