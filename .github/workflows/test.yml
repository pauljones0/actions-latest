name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tooling
        run: python scripts/install_tooling.py
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint and format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Regression and protocol tests
        run: uv run --frozen pytest -q
      - name: Validate snapshot
        run: uv run --frozen python update.py --check
      - name: Fresh wheel installation
        if: matrix.python == '3.12'
        run: uv run --frozen python scripts/smoke_install.py
      - name: Validate workflow security
        if: matrix.python == '3.12'
        run: uv run --frozen zizmor --offline --min-severity high .github/workflows
