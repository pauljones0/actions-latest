name: Refresh action observations and scans
on:
  schedule:
    - cron: '51 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: action-catalog-update
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tooling and locked dependencies
        run: |
          python scripts/install_tooling.py
          uv sync --locked --group dev
      - name: Test before updating
        run: uv run --frozen pytest -q
      - name: Refresh observations and manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          uv run --frozen python update.py --discover | tee "$RUNNER_TEMP/update-summary.json"
      - name: Validate replacement snapshot
        run: uv run --frozen python update.py --check
      - name: Commit and push snapshot
        # A rejected push deliberately fails. Rerun from current main to rebuild
        # against concurrent catalog edits; never merge or force generated state.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add actions_latest/actions.db data
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh action observations and security scans'
            uv run --frozen python scripts/push_snapshot.py
          fi
      - name: Review published changes
        run: python scripts/render_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Report observation coverage
        run: |
          uv run --frozen python update.py --health
      - name: Explain the failure and recovery action
        if: failure()
        run: python scripts/job_failure.py refresh
