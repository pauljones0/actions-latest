name: Refresh action observations and scans
on:
  schedule:
    - cron: '51 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: action-catalog-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install tooling and locked dependencies
        run: |
          python -m pip install uv==0.12.10
          uv sync --locked --group dev
      - name: Test before updating
        run: uv run --frozen pytest -q
      - name: Refresh observations and manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          uv run --frozen python update.py --discover | tee "$RUNNER_TEMP/update-summary.json"
          cat "$RUNNER_TEMP/update-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate replacement snapshot
        run: uv run --frozen python update.py --check
      - name: Commit and push snapshot
        # A rejected push deliberately fails. Rerun from current main to rebuild
        # against concurrent catalog edits; never merge or force generated state.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add actions_latest/actions.db data
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh action observations and security scans'
            uv run --frozen python scripts/push_snapshot.py
          fi
      - name: Report observation coverage
        run: |
          uv run --frozen python update.py --health | tee -a "$GITHUB_STEP_SUMMARY"
