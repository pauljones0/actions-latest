name: Maintain dependencies and tooling
on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: action-catalog-update
  cancel-in-progress: false
jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/install_tooling.py
      - name: Prepare compatible upgrades
        run: uv run --frozen python scripts/maintain.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate proposed upgrades
        run: |
          python scripts/install_tooling.py
          uv sync --locked --group dev
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          for version in 3.10 3.12 3.14; do
            uv run --locked --python "$version" pytest -q
          done
          uv run --locked --python 3.12 python update.py --check
          uv run --frozen python scripts/smoke_install.py
          uv run --frozen zizmor --offline --min-severity high .github/workflows
      - name: Record successful validation
        run: uv run --frozen python scripts/maintain.py --finalize >> "$GITHUB_STEP_SUMMARY"
      - name: Publish tested maintenance and refresh evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock actions_latest/models.py tooling.json data/dependency-review.md data/dependency-review.json
          if ! git diff --staged --quiet; then
            git commit -m 'Maintain compatible dependencies and scanner contract'
            uv run --frozen python scripts/push_snapshot.py
          fi
          gh workflow run update.yml --ref main
      - name: Preserve the exact failed maintenance proposal
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-proposal
          path: |
            data/maintenance-proposal.patch
            data/dependency-review.md
            data/dependency-review.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Explain the failure and recovery action
        if: failure()
        run: python scripts/job_failure.py maintain
